[project]
name = "wasabi-mcp"
version = "0.1.0"
description = "An MCP server for Wasabi cloud storage: S3, IAM, STS, Stats and WACM Connect."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "boto3",
    "httpx",
]

[project.scripts]
wasabi-mcp = "wasabi_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "moto[server]",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasabi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: runs against a real Wasabi account (needs WASABI_LIVE=1 and keys)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
