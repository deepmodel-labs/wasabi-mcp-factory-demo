# Repo override of dmx's bundled dev loop: the same loop without a test run after
# each phase. Tests run once per ticket in the validate loop (test_command in
# config.md) and again in CI on the pull request.
name: dev
skills:
  - implement-next-phase
  - commit
trigger:
  type: on_complete
goal_state: "All phases implemented and committed, no unchecked tasks remaining"
repeat_until: all_phases_complete
on_optional_failure: warn
failure_handling: pause
human_gate: true
on_complete:
  on_success:
    trigger_loop: validate
  on_failure:
    trigger_loop: null
  on_warning:
    trigger_loop: null
