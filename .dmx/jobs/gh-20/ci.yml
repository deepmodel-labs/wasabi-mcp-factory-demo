name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  live:
    name: Live (real Wasabi)
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      WASABI_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
      WASABI_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
      WASABI_REGION: ${{ vars.WASABI_REGION || 'us-east-1' }}
      WASABI_LIVE: "1"
      WASABI_MCP_READ_ONLY: "false"
    steps:
      - name: Check for Wasabi keys
        id: keys
        run: |
          if [ -n "$WASABI_ACCESS_KEY_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "WASABI_ACCESS_KEY_ID isn't set; skipping live tests."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.keys.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.keys.outputs.present == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - if: steps.keys.outputs.present == 'true'
        run: uv sync --locked
      - if: steps.keys.outputs.present == 'true'
        name: Live tests
        # Exit code 5 means no live tests were collected (tests/live/ arrives in ticket 24).
        run: uv run pytest -q -m live || [ $? -eq 5 ]
